<main class="app-main"><div class="page-wrap"><section class="content-card"><header class="page-header"><div class="page-head-row"><div><a class="back-link" href="政策管理.html"><span data-icon="arrowLeft"></span>返回政策管理</a><h1 class="page-title">编辑政策</h1><div class="breadcrumb"><a href="工作台.html">工作台</a><span class="muted">/</span><a href="政策管理.html">专区内容管理</a><span class="muted">/</span><span class="muted">编辑政策</span></div></div><div class="header-actions"></div></div></header><div class="detail-body form-page"><section class="form-section"><div class="form-section-title"><h2>政策基本信息</h2></div><div class="form-grid"><div class="form-item wide"><label class="required">政策标题</label><div class="form-value"><input class="control" type="text" value="绿色智能建造产业领域职业技能培训工作通知"></div></div><div class="form-item "><label class="">政策分类</label><div class="form-value"><div class="select-wrap"><select class="control"><option>培训政策</option><option>评价政策</option><option>办事指南</option></select></div></div></div><div class="form-item "><label class="">发布单位</label><div class="form-value"><input class="control" type="text" value="湖北省住房和城乡建设厅"></div></div><div class="form-item "><label class="">发布时间</label><div class="form-value"><input class="control" type="date" value="2026-08-07"></div></div><div class="form-item "><label class="">适用地区</label><div class="form-value"><input class="control" type="text" value="湖北省"></div></div><div class="form-item "><label class="">来源</label><div class="form-value"><input class="control" type="text" value="省住建厅工作通知"></div></div><div class="form-item "><label class="">有效状态</label><div class="form-value"><div class="select-wrap"><select class="control"><option>生效中</option><option>草稿</option><option>已失效</option></select></div></div></div><div class="form-item wide"><label class="">政策摘要</label><div class="form-value"><textarea class="control" rows="4">面向绿色智能建造产业领域重点工种开展职业技能培训，提升产业工人专业技能水平。</textarea></div></div><div class="form-item wide"><label class="required">政策正文</label><div class="form-value"><textarea class="control" rows="16">为加快绿色智能建造产业技能人才培养，提升产业工人专业技能水平，现就开展绿色智能建造产业领域重点工种职业技能培训工作通知如下。

一、培训对象
从事或拟从事绿色智能建造相关岗位的产业工人、企业技术人员和一线作业人员。

二、重点培训工种
建筑信息模型技术员、工程数据管理员、装配式构件生产操作员、部品部件质量检测员、装配式建筑施工员、智能装备操作员、建筑机器人操作员、建筑设备智慧运维员、智慧物业管理员。

三、培训组织
培训机构依据培训大纲制定课程与班次，公开培训方式、培训时间、招生名额、报名材料及综合报名费。个人或团队在产业培育专区提交报名资料，受理通过并完成缴费后参加培训。

四、考试评价
培训完成后由培训机构统一送考，评价机构负责资格审核、考试安排、成绩确认和证书发放。理论考试和实操考试均合格的，考试结果为通过。

五、证书与补贴
考试通过后按规定生成职业技能证书；符合条件的人员可按照相关补贴政策和申报渠道申请职业技能培训补贴。</textarea></div></div><div class="form-item wide"><label class="">附件</label><div class="form-value"><button class="upload-box" data-toast="文件已选择"><span data-icon="attachment"></span>上传政策附件</button></div></div></div></section><div class="form-footer"><a class="btn" href="政策管理.html">取消</a><button class="btn" data-page-submit="草稿已保存">保存草稿</button><button class="btn btn-primary" data-page-submit="政策内容已保存">保存</button></div></div></section></div></main>
