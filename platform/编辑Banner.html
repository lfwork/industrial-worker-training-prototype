<div class="header-actions">
</div>

<div class="detail-body form-page">
<section class="form-section">
<div class="form-section-title">
<h2>基本信息</h2>
</div>
<div class="form-grid">
<div class="form-item wide">
<label class="required">Banner名称</label>
<div class="form-value">
<input class="control" type="text" value="绿色智能建造九大新工种培训启航">
</div>
</div>
<div class="form-item ">
<label class="">展示终端</label>
<div class="form-value">
<div class="select-wrap">
<select class="control">
<option>PC端</option>
<option>H5端</option>
</select>
</div>
</div>
</div>
<div class="form-item ">
<label class="required">状态</label>
<div class="form-value">
<div class="select-wrap">
<select class="control" name="status" required>
<option value="展示中" selected>展示中</option>
<option value="待发布">待发布</option>
<option value="已停用">已停用</option>
</select>
</div>
</div>
</div>
<div class="form-item ">
<label class="">展示位置</label>
<div class="form-value">
<div class="select-wrap">
<select class="control">
<option>专区首页首屏</option>
<option>专区首页第2帧</option>
</select>
</div>
</div>
</div>
<div class="form-item ">
<label class="">生效日期</label>
<div class="form-value">
<input class="control" type="date" value="2026-08-20">
</div>
</div>
<div class="form-item ">
<label class="">失效日期</label>
<div class="form-value">
<input class="control" type="date" value="2026-10-31">
</div>
</div>
<div class="form-item ">
<label class="">排序</label>
<div class="form-value">
<input class="control" type="number" value="1">
</div>
</div>
<div class="form-item wide">
<label class="">跳转内容</label>
<div class="form-value">
<input class="control" type="text" value="九大新工种课程列表">
</div>
</div>
<div class="form-item wide">
<label class="">Banner图片</label>
<div class="form-value">
<button class="upload-box" data-toast="文件已选择">
<span data-icon="attachment">
</span>上传Banner图片</button>
</div>
</div>
</div>
</section>
<div class="form-footer">
<a class="btn" href="Banner管理.html">取消</a>
<button class="btn" data-page-submit="草稿已保存">保存草稿</button>
<button class="btn btn-primary" data-page-submit="内容已保存">保存</button>
</div>
</div>
</section>
</div>
</main>
<div id="service-state-modal" class="modal-mask">
<section class="modal">
<header class="modal-head">
<h2>维护服务状态</h2>
<button class="icon-btn" type="button" data-close-overlay>
<span data-icon="close">
</span>
</button>
</header>
<div class="modal-body">
<p>机构：<strong data-service-org>—</strong>
</p>
<div class="service-modal-choice">
<label class="choice-card selected">
<input type="radio" name="service-choice" value="暂停服务" checked>暂停服务</label>
<label class="choice-card">
<input type="radio" name="service-choice" value="终止服务">终止服务</label>
</div>
<label class="field">
<span>维护原因</span>
<textarea id="service-reason" class="control" rows="4">
</textarea>
</label>
<div id="service-error" class="error">
</div>
</div>
<footer class="modal-foot">
<button class="btn" data-close-overlay>取消</button>
<button id="service-confirm" class="btn btn-danger">确认</button>
</footer>
</section>
</div>

</div>
