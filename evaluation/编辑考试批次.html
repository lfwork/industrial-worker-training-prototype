<main class="app-main"><div class="page-wrap"><section class="content-card"><header class="page-header"><div class="page-head-row"><div><a class="back-link" href="考试批次.html"><span data-icon="arrowLeft"></span>返回考试批次</a><h1 class="page-title" data-exam-edit-title>编辑考试批次</h1><div class="breadcrumb"><a href="机构信息.html">机构信息</a><span class="muted">/</span><a href="考试批次.html">考务管理</a><span class="muted">/</span><span class="muted" data-exam-edit-crumb>编辑考试批次</span></div></div></div></header>
<div class="detail-body form-page" data-exam-form>
<section class="form-section"><div class="form-section-title"><h2>01 基本信息</h2><span class="muted" data-exam-number></span></div><div class="form-grid"><div class="form-item wide"><label class="required">批次名称</label><div class="form-value"><input class="control" data-field="name" type="text" placeholder="请输入考试批次名称"></div></div><div class="form-item"><label class="required">考试项目</label><div class="form-value"><div class="select-wrap"><select class="control" data-field="project"><option value="">请选择</option><option>建筑信息模型技术员职业技能评价</option><option>装配式建筑施工员职业技能评价</option></select></div></div></div><div class="form-item"><label class="required">考试日期</label><div class="form-value"><input class="control" data-field="date" type="date"></div></div><div class="form-item"><label class="required">开始时间</label><div class="form-value"><input class="control" data-field="startTime" type="time"></div></div><div class="form-item"><label class="required">结束时间</label><div class="form-value"><input class="control" data-field="endTime" type="time"></div></div><div class="form-item"><label class="required">考点</label><div class="form-value"><input class="control" data-field="site" type="text" placeholder="请输入考点"></div></div><div class="form-item"><label>考试方式</label><div class="form-value"><div class="select-wrap"><select class="control" data-field="mode"><option>线下理论 + 线下实操</option><option>线下理论</option><option>线下实操</option></select></div></div></div></div></section>
<section class="form-section"><div class="form-section-title"><h2>02 考场安排</h2></div><div class="standard-table-shell"><table class="standard-table edit-structure-table" style="min-width:720px"><thead><tr><th>考场名称</th><th>考场位置</th><th>容量</th><th class="sticky-op">操作</th></tr></thead><tbody data-edit-rooms></tbody></table></div><button class="btn btn-link add-structure" type="button" data-add-room>＋ 添加考场</button></section>
<section class="form-section"><div class="form-section-title"><div><h2>03 考生安排</h2><p class="form-section-note">已选择 <strong data-edit-candidate-count>0</strong> 名考生；可手工分配考场和座位。</p></div><button class="btn" type="button" data-open-candidate-modal>选择考生</button></div><div class="batch-toolbar" data-batch-toolbar hidden><span>已选 <strong data-edit-selected-count>0</strong> 人</span><div class="select-wrap"><select class="control" data-batch-room><option value="">批量设置考场</option></select></div><button class="btn" type="button" data-apply-batch-room>应用</button></div><div class="standard-table-shell"><table class="standard-table edit-structure-table" style="min-width:840px"><thead><tr><th class="table-check"><input type="checkbox" data-select-all-candidates></th><th>姓名</th><th>准考证号</th><th>考场</th><th>座位</th><th class="sticky-op">操作</th></tr></thead><tbody data-edit-candidates></tbody></table></div></section>
<section class="form-section"><div class="form-section-title"><h2>04 监考人员安排</h2></div><div class="standard-table-shell"><table class="standard-table edit-structure-table" style="min-width:840px"><thead><tr><th>考场</th><th>人员角色</th><th>监考人员</th><th>联系电话</th><th class="sticky-op">操作</th></tr></thead><tbody data-edit-proctors></tbody></table></div><button class="btn btn-link add-structure" type="button" data-add-proctor>＋ 添加监考人员</button></section>
<section class="form-section"><div class="form-section-title"><h2>备注</h2></div><textarea class="control" rows="4" data-field="remark" placeholder="补充现场组织说明，不代替考场、考生和监考人员的结构化安排。"></textarea></section>
<div class="form-footer"><a class="btn" href="考试批次.html">取消</a><button class="btn" type="button" data-save-exam="draft">保存草稿</button><button class="btn btn-primary" type="button" data-save-exam="prepared">保存批次</button></div>
</div></section></div></main>
<div class="modal-mask" data-candidate-modal><section class="modal exam-candidate-modal"><header class="modal-head"><h2>选择考生</h2><button class="icon-btn" type="button" data-close-exam-modal>×</button></header><div class="modal-body"><div class="candidate-modal-tools"><div class="input-wrap"><span data-icon="search"></span><input class="control has-icon" data-candidate-search placeholder="姓名 / 平台报名编号"></div></div><div class="standard-table-shell"><table class="standard-table" style="min-width:700px"><thead><tr><th class="table-check"></th><th>姓名</th><th>平台报名编号</th><th>工种/考试项目</th><th>来源机构</th><th>当前状态</th></tr></thead><tbody data-candidate-pool></tbody></table></div></div><footer class="modal-foot"><button class="btn" type="button" data-close-exam-modal>取消</button><button class="btn btn-primary" type="button" data-confirm-candidates>确定</button></footer></section></div>
